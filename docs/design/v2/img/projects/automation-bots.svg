<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Automation bots architecture: sources to scheduling and browser automation to change detection to Telegram delivery">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d6b4f"></path>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ece6d9"></rect>

  <text x="60" y="70" font-size="18" font-family="ui-monospace, Menlo, monospace" letter-spacing="3" font-weight="600" fill="#6b665c">AUTOMATION BOTS</text>
  <text x="60" y="104" font-size="30" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" font-weight="600" fill="#232019">One pattern, three bots</text>

  <g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
    <rect x="40" y="205" width="250" height="230" fill="#f8f5ee" stroke="#cfc6b2" stroke-width="1.5"></rect>
    <text x="66" y="252" font-size="24" font-weight="600" fill="#3d6b4f">Sources</text>
    <text x="66" y="292" font-size="19" fill="#6b665c">Paginated 3rd-party API</text>
    <text x="66" y="322" font-size="19" fill="#6b665c">TU Delft NetID portal</text>
    <text x="66" y="352" font-size="19" fill="#6b665c">Local event feeds</text>

    <rect x="330" y="205" width="250" height="230" fill="#f8f5ee" stroke="#cfc6b2" stroke-width="1.5"></rect>
    <text x="356" y="252" font-size="24" font-weight="600" fill="#3d6b4f">Schedule &amp; drive</text>
    <text x="356" y="292" font-size="19" fill="#6b665c">Celery beat: polling</text>
    <text x="356" y="322" font-size="19" fill="#6b665c">Playwright headless</text>
    <text x="356" y="352" font-size="19" fill="#6b665c">browser (SSO login)</text>

    <rect x="620" y="205" width="250" height="230" fill="#f8f5ee" stroke="#cfc6b2" stroke-width="1.5"></rect>
    <text x="646" y="252" font-size="24" font-weight="600" fill="#3d6b4f">Detect &amp; process</text>
    <text x="646" y="292" font-size="19" fill="#6b665c">Snapshot + diff</text>
    <text x="646" y="322" font-size="19" fill="#6b665c">Instant slot grab</text>
    <text x="646" y="352" font-size="19" fill="#6b665c">Dedupe + aggregate</text>

    <rect x="910" y="205" width="250" height="230" fill="#f8f5ee" stroke="#cfc6b2" stroke-width="1.5"></rect>
    <text x="936" y="252" font-size="24" font-weight="600" fill="#3d6b4f">Notify</text>
    <text x="936" y="292" font-size="19" fill="#6b665c">aiogram bot</text>
    <text x="936" y="322" font-size="19" fill="#6b665c">→ Telegram user</text>
    <text x="936" y="352" font-size="19" fill="#6b665c">alerts · bookings · feed</text>
  </g>

  <g stroke="#3d6b4f" stroke-width="2.5" fill="none">
    <line x1="292" y1="320" x2="326" y2="320" marker-end="url(#ah)"></line>
    <line x1="582" y1="320" x2="616" y2="320" marker-end="url(#ah)"></line>
    <line x1="872" y1="320" x2="906" y2="320" marker-end="url(#ah)"></line>
  </g>

  <g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
    <text x="60" y="520" font-size="16" font-family="ui-monospace, Menlo, monospace" letter-spacing="2" font-weight="600" fill="#6b665c">STACK</text>
    <g font-size="18" fill="#403a30">
      <rect x="60" y="540" width="96" height="40" fill="none" stroke="#cfc6b2"></rect>
      <text x="108" y="566" text-anchor="middle">Python</text>
      <rect x="170" y="540" width="110" height="40" fill="none" stroke="#cfc6b2"></rect>
      <text x="225" y="566" text-anchor="middle">aiogram</text>
      <rect x="294" y="540" width="96" height="40" fill="none" stroke="#cfc6b2"></rect>
      <text x="342" y="566" text-anchor="middle">Celery</text>
      <rect x="404" y="540" width="128" height="40" fill="none" stroke="#cfc6b2"></rect>
      <text x="468" y="566" text-anchor="middle">Playwright</text>
      <rect x="546" y="540" width="90" height="40" fill="none" stroke="#cfc6b2"></rect>
      <text x="591" y="566" text-anchor="middle">Redis</text>
    </g>
  </g>
</svg>