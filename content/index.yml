beyond:
  eyebrow: 'Beyond the code'
  title: 'Where I grew up, and what I do off the clock'
  roots:
    title: 'How I got here'
    body: >-
      I grew up in Moldova, a loud kid in a one-room apartment, me and my older
      sister, parents who’d come from the village to the capital to study and
      stayed. Family legend says my maths got good right after I took a knock to
      the head at a taekwondo competition, a coincidence I’ve been happy to take
      credit for ever since. I went to a small neighbourhood school where no one
      expected much of me, and at ten I walked into my first olympiad and came
      home with first in the district and second in the whole city. At the
      parents’ evening after, the teacher wouldn’t stop praising me, and my
      parents beamed.
  off_clock:
    title: 'When I’m not shipping'
    body: >-
      I’m back on the taekwondo mat these days, a beginner again, years after an
      injury stopped me the first time. Otherwise: books I finish even when
      they’ve stopped being good (I never drop one), board game nights with
      friends, cooking, and always music.

contact:
  eyebrow: 'Say hello'
  title: 'I’m always up for a good conversation.'
  lead: 'About a role, a hard problem, or just what you’re building.'
