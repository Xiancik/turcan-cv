# Prose for index.html. Edit here, then run `npm run build`.
# Values may contain inline HTML (<em>, <a>, <b>, <span>). Structural tags
# (<article>, <section>, <div>, <ul>, <h3>) live in the .html file.

hero:
  eyebrow: 'Positioning'
  headline: 'I build software, <em>end to end</em>.'
  sub: >-
    Embedded systems, machine learning, and the software that ties them
    together. I like every part of it.
  caption: 'Delft, NL · shipping since 2024'

work:
  eyebrow: 'Selected work'
  title: 'Where I’ve been building'
  lead: 'Real, paid, in-production work. The <a href="experience.html">full story lives here</a>.'
  roles:
    offroad:
      title: 'Software Engineer'
      org: '<a class="role__company" href="https://offroadapps.nl/vitalsiq/?lang=en" target="_blank" rel="noopener noreferrer">Offroad Apps (VitalsIQ)</a> · Delft · Jan 2026 - Present'
      summary: 'Vitals streamed live from Garmin wearables into a companion app, a tactical mapping plugin, and a barcode library rewritten from scratch.'
    insyght:
      title: 'Embedded Software Engineer'
      org: '<a class="role__company" href="https://insyght.io/en/" target="_blank" rel="noopener noreferrer">Insyght.io</a> · Delft · Aug 2025 - Present'
      summary: 'Firmware, an on-device noise classifier, and the factory test framework.'
    altix:
      title: 'Machine Learning Engineer Intern'
      org: '<a class="role__company" href="https://www.altix.nl/" target="_blank" rel="noopener noreferrer">Altix Capital</a> · Amsterdam · Apr 2025 - Jun 2025'
      summary: 'Documents, spreadsheets and scans parsed, summarised and classified, plus the service and interface analysts screen in.'
    huawei:
      title: 'Machine Learning Engineer Intern'
      org: '<a class="role__company" href="https://www.huawei.com/en/" target="_blank" rel="noopener noreferrer">Huawei</a> · Amsterdam · Dec 2024 - May 2025'
      summary: 'Keyword spotting, audio dataset curation, and benchmarking for speech recognition and synthesis.'

things:
  eyebrow: 'Things I’ve built'
  title: 'Side quests, for the love of it'
  lead: 'Self-directed and competition work. <a href="projects.html">See them all</a>.'
  projects:
    mesh:
      domain: 'Computational Geometry'
      name: 'Perception-Aware 3D Mesh Simplification'
      desc: 'A QEM mesh solver for Huawei’s IMC Challenge.'
    prosperity:
      domain: 'Quantitative Trading'
      name: 'IMC Prosperity 4: Algorithmic Trading'
      desc: 'Options market-making with Black-Scholes pricing, an IV-smile fit, and a time-series test library.'
    automation:
      domain: 'Automation · Services'
      name: 'Telegram &amp; Automation Bots'
      desc: 'Small real-world issues, automated away: change alerts, a gym-slot grabber, an event feed.'
    brainfuck:
      domain: 'Assembly · Compilers'
      name: 'A JIT Compiler for Brainfuck'
      desc: 'A just-in-time compiler written entirely in assembly, emitting native machine code by hand.'

beyond:
  eyebrow: 'Beyond the code'
  title: 'Where I grew up, and what I do off the clock'
  roots:
    title: 'How I got here'
    body: >-
      I grew up in Moldova, a loud kid in a one-room apartment, me and my older
      sister. A family legend says my maths got good right after I took a knock to
      the head at a taekwondo competition, a coincidence I find funny and decided to stick to it.
      I went to a small neighbourhood school, and at ten I walked into my first olympiad and came
      home with first in the district and second in the whole city.
  off_clock:
    title: 'When I’m not shipping'
    body: >-
      I’m back in the taekwondo these days, a beginner again, years after an
      injury stopped me. Otherwise: books I finish even when
      they’ve stopped being good (I never drop one), board game nights with
      friends, cooking, and always music.

contact:
  eyebrow: 'Say hello'
  title: 'I’m always up for a good conversation.'
  lead: 'About a role, a hard problem, or just what you’re building.'
