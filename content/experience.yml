work:
  eyebrow: 'Work'
  title: 'Roles I’ve shipped in'
  lead: >-
    Real, paid engineering, newest at the top. Each role expands into
    the discrete projects that shipped inside it.
  now: '<span class="career-now__tag">Now</span> Aug 2026: two roles, in parallel'
  roles:
    offroad:
      when: 'Jan 2026 - <span class="role__now">Present</span>'
      title: 'Software Engineer<span class="role__pt">Part-time</span>'
      org: '<a class="role__company" href="https://offroadapps.nl/vitalsiq/?lang=en" target="_blank" rel="noopener noreferrer">Offroad Apps (VitalsIQ)</a> · Delft, Netherlands'
      summary: 'Garmin wearables into a live vital-sign pipeline feeding a .NET MAUI companion app and an ATAK plugin.'
      projects_label: 'Projects'
      projects:
        garmin:
          title: 'Garmin binding + MAUI app'
          summary: >-
            A .NET 10 Android binding of Garmin’s native Health SDK and a MAUI companion app that pairs wearables and
            streams 7 vital-sign types (heart rate, HRV, SpO₂, ...) to the VitalsIQ backend.
          metric: '7 live vital types'
        civtak:
          title: 'CivTAK plugin'
          summary: >-
            A Java plugin for CivTAK (civilian ATAK) that surfaces the VitalsIQ app as an in-app pane and a live map marker.
          metric: ''
        jabcode:
          title: 'JABCode C → C# port'
          summary: >-
            The full JABCode colour 2D-barcode library - encoder and
            decoder with Reed-Solomon error correction - ported from C to C#.
          metric: ''
    insyght:
      when: 'Aug 2025 - <span class="role__now">Present</span>'
      title: 'Embedded Software Engineer<span class="role__pt">Part-time</span>'
      org: '<a class="role__company" href="https://insyght.io/en/" target="_blank" rel="noopener noreferrer">Insyght.io</a> · Delft, Netherlands'
      summary: 'Firmware for <em>AuraSense</em>, a solar-powered nRF54L15 + nRF9151 noise and air-quality IoT monitor.'
      projects_label: 'Projects'
      projects:
        classifier:
          title: 'On-device noise classifier'
          summary: >-
            End-to-end pipeline (data preparation, training, evaluation and
            firmware integration) for on-device inference on the nRF54L15.
          metric: '92% @ 40 KB'
        firmware:
          title: 'Zephyr firmware architecture'
          summary: >-
            AuraSense firmware in C/C++ on Zephyr RTOS and the nRF Connect
            SDK, architected as 11 self-contained driver components.
        testrig:
          title: 'Factory test framework (Insyght Testsuite)'
          summary: >-
            An automated end-of-line framework: a PySide6 head-unit GUI
            orchestrating multiple Raspberry Pi module units over MQTT,
            driving firmware flashing, hardware monitoring (voltage, current,
            temperature), AT-command network checks and HackRF-based RF
            signal generation.
          metric: ''
    altix:
      when: 'Apr 2025 - Jun 2025'
      title: 'Machine Learning Engineer Intern'
      org: '<a class="role__company" href="https://www.altix.nl/" target="_blank" rel="noopener noreferrer">Altix Capital</a> · Amsterdam, Netherlands'
      summary: 'An AI document-ingestion pipeline that sped up analyst screening.'
      project: 'AltixDocs'
      project_label: 'Project'
      points:
        1: >-
          Built an AI document-ingestion pipeline to parse PDFs, spreadsheets,
          and images (with OCR), then auto-summarise and classify content,
          cutting manual screening from 20 minutes per document to 2.
        2: >-
          Shipped a REST service and lightweight web UI that streamlined
          analyst review, cutting document navigation and handling time.
    huawei:
      when: 'Dec 2024 - May 2025'
      title: 'Machine Learning Engineer Intern'
      org: '<a class="role__company" href="https://www.huawei.com/en/" target="_blank" rel="noopener noreferrer">Huawei</a> · Amsterdam, Netherlands'
      summary: 'Keyword-spotting and ASR/TTS data and benchmarking pipelines for speech models.'
      projects_label: 'Projects'
      projects:
        kws:
          title: 'English keyword-spotting pipeline'
          summary: >-
            Develop the training and evaluation pipeline for an English
            keyword-spotting model.
        dataset:
          title: 'Audio dataset curation'
          summary: >-
            Built, cleaned and validated large-scale audio datasets with
            forced alignment and transfer learning.
          metric: '100 → 300+ h data'
        benchmark:
          title: 'ASR/TTS benchmarks'
          summary: >-
            A reproducible benchmarking pipeline for ASR and TTS candidates,
            covering data loading, inference, scoring and reporting.

