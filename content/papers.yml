head:
  eyebrow: 'Research · TU Delft'
  title: 'Questions worth a semester'
  intro: >-
    Two strands I chased at TU Delft: teaching models to make good
    <em>decisions</em>, not just good predictions. And graph neural networks
    for the graphs where similar things don’t connect.

dfl:
  title: 'Learning Feasible Decisions Directly from Features for Combinatorial Optimization'
  byline: '<span class="me">Cristian Turcan</span> · first author'
  venue: 'TU Delft Honours Programme'
  badge: 'Under review · BNAIC 2026'
  lede: 'A solver-free way to predict decisions that are feasible by construction, trained to minimise regret, not prediction error.'
  abstract: >-
    Proposes <strong>LR-STE</strong>, which projects a neural predictor’s
    output onto the problem’s linear relaxation and applies a
    feasibility-correction layer, trained end-to-end with a straight-through
    estimator to minimise decision regret rather than prediction error.
    Benchmarked on 0/1 Knapsack and the Travelling Salesperson Problem against
    SPO+, two-stage predict-then-optimize, and projection-free (STE) baselines.
  link: 'Read the paper'

het:
  title: 'Heterophilic Methods on Multi-Label Graphs'
  byline: '<span class="me">Cristian Turcan</span> · sole author'
  venue: 'TU Delft · Bachelor thesis (CSE3000)'
  lede: 'On multi-label graphs, how tightly a graph “sticks together” predicts accuracy more than how clever the model is.'
  abstract: >-
    Benchmarked 8 models (MLP and DeepWalk baselines plus 6 heterophily GNNs:
    H2GCN, GPR-GNN, LINKX, FAGCN, ACM-GCN, Ordered GNN) across 5 real and 2
    synthetic multi-label graphs in PyTorch Geometric. Controlled homophily and
    label-cardinality sweeps showed that node-classification performance tracks
    graph homophily more than model sophistication. Built <em>gnnbench</em>, a
    config-driven pipeline with a synthetic multi-label graph generator,
    hardened with split-leakage tests and parallelised as SLURM array jobs on
    TU Delft’s DelftBlue cluster.
  link: 'Read the thesis'
