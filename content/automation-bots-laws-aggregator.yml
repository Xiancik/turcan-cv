# Prose for projects/automation-bots/laws-aggregator.html. Edit here, then run `npm run build`.

hero:
  eyebrow: 'Automation · Alerts'
  title: 'Legal Acts Bot'
  summary: 'A Telegram bot that pushes newly published Moldovan legal acts to users, filtered by the topic sectors they subscribe to.'

overview:
  title: 'Overview'
  body: >-
    Legal acts publish on legis.md constantly, but nobody wants to watch the
    feed. I wanted people to pick a handful of sectors &mdash; Fiscal,
    S&#259;n&#259;tate, Munc&#259; &mdash; and get the matching acts pushed to
    them as they land, in Romanian, with a daily-digest option for anyone who
    would rather not be pinged in real time.

built:
  title: 'What I built'
  body: >-
    A second product on top of the event-aggregator&rsquo;s stack &mdash;
    aiogram bot, Celery beat + workers, Redis broker, Postgres state, all in
    Docker Compose. A scraper polls legis.md every 30&nbsp;minutes, a matcher
    fans an incoming act out to every subscribed user, and a delivery worker
    sends the message with retry-on-429 and auto-pause the moment a user
    blocks the bot.

highlights:
  title: 'Highlights'
  items:
    idempotent: 'Idempotent deliveries table so re-runs never double-send.'
    staleness: 'Fixture-tested parser with a 24h staleness alert if legis.md&rsquo;s HTML shifts.'
    ux: 'Romanian UI, inline sector keyboard, realtime &harr; daily-digest toggle.'

gallery:
  title: 'Gallery'
  topics_caption: 'Multi-select sector keyboard'
  delivery_caption: 'One act, delivered as it lands'
